[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro generates static HTML for game, category, tag, and article routes.
# Do not apply COEP globally: many third-party demo hosts cannot be embedded
# under cross-origin isolation. Add COOP/COEP only to a self-hosted threaded
# game route after verifying every required asset has CORP/CORS headers.

[[redirects]]
  from = "/games/"
  to = "/games"
  status = 301

[[redirects]]
  from = "/categories/"
  to = "/categories"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/blog"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
